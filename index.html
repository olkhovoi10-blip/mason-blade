function BookingFlow({ preselected }) {
  const [service, setService] = useState(null);
  const [barber, setBarber] = useState(null);
  const [date, setDate] = useState(null);
  const [time, setTime] = useState(null);
  const [name, setName] = useState("");
  const [phone, setPhone] = useState("");
  const [email, setEmail] = useState("");
  const [monthOffset, setMonthOffset] = useState(0);
  const [confirmed, setConfirmed] = useState(null);
  const [toastMsg, setToastMsg] = useState(null);

  useEffect(() => { if (preselected) setService(preselected); }, [preselected]);
  useEffect(() => {
    if (!toastMsg) return;
    const t = setTimeout(() => setToastMsg(null), 3500);
    return () => clearTimeout(t);
  }, [toastMsg]);

  const now = new Date();
  const monthStart = new Date(now.getFullYear(), now.getMonth() + monthOffset, 1);
  const gridStart = new Date(monthStart);
  gridStart.setDate(1 - ((monthStart.getDay() + 6) % 7));
  const days = [];
  for (let i = 0; i < 42; i++) days.push(new Date(gridStart.getFullYear(), gridStart.getMonth(), gridStart.getDate() + i));

  const svc = SERVICES.find((s) => s.id === service);
  const brb = BARBERS.find((b) => b.id === barber);
  const canConfirm = service && barber && date && time && name.trim().length > 1 && phone.trim().length >= 7 && /\S+@\S+\.\S+/.test(email);

  const confirm = () => {
    if (!canConfirm) return;
    const ref = "MB-8004-" + Math.floor(1000 + Math.random() * 9000);
    setConfirmed({ ref });
    setToastMsg("Chair reserved · " + ref);
  };
  const reset = () => {
    setConfirmed(null);
    setService(null); setBarber(null); setDate(null); setTime(null);
    setName(""); setPhone(""); setEmail("");
  };

  const summary = [
    ["Service", svc ? svc.name : "—"],
    ["Barber", brb ? brb.name : barber === "any" ? "No preference" : "—"],
    ["Date", date ? fmtDay(date) : "—"],
    ["Time", time || "—"],
  ];

  return (
    <section id="booking" data-testid="booking-section" className="bg-espresso border-y border-brass/20">
      <div className="max-w-[1440px] mx-auto px-6 lg:px-12 py-24 lg:py-32">

          <Eyebrow className="mb-5">06 · Reservations</Eyebrow>

          </h2>
        </Reveal>
        <div className="grid grid-cols-1 lg:grid-cols-12 gap-10">
          <div className="lg:col-span-7 space-y-14">
            <Reveal>
              <div data-testid="booking-step-service">
                <StepLabel n="01" title="Choose service" done={!!service} />
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                  {SERVICES.map((s) => (
                    <button key={s.id} data-testid={"booking-service-option-" + s.id} onClick={() => setService(s.id)}
                      className={"flex items-center justify-between border px-5 py-4 text-left transition-colors duration-300 " + (service === s.id ? "border-brass bg-surface-2" : "border-cream/10 hover:border-brass/50")}>
                      <span className="text-sm text-cream">{s.name}</span>
                      <span className="font-display text-brass">{s.price}</span>
                    </button>
                  ))}
                </div>
              </div>
            </Reveal>
            <Reveal>
              <div data-testid="booking-step-barber">
                <StepLabel n="02" title="Choose barber" done={!!barber} />
                <div className="grid grid-cols-1 sm:grid-cols-3 gap-2">
                  {[...BARBERS.map((b) => ({ id: b.id, name: b.name, sub: b.role })), { id: "any", name: "No preference", sub: "First available" }].map((b) => (
                    <button key={b.id} data-testid={"booking-barber-option-" + b.id} onClick={() => setBarber(b.id)}
                      className={"border px-5 py-4 text-left transition-colors duration-300 " + (barber === b.id ? "border-brass bg-surface-2" : "border-cream/10 hover:border-brass/50")}>
                      <p className="text-sm text-cream">{b.name}</p>
                      <p className="text-[11px] uppercase tracking-[0.18em] text-beige/60 mt-1">{b.sub}</p>
                    </button>
                  ))}
                </div>
              </div>
            </Reveal>
            <Reveal>
              <div data-testid="booking-step-date">
                <StepLabel n="03" title="Choose date" done={!!date} />
                <div className="border border-cream/10 bg-surface p-6 max-w-md">
                  <div className="flex items-center justify-between mb-6">
                    <button data-testid="booking-calendar-prev" aria-label="Previous month" disabled={monthOffset === 0} onClick={() => setMonthOffset((m) => Math.max(0, m - 1))} className="text-beige disabled:opacity-25 hover:text-brass transition-colors p-1"><IcLeft size={18} /></button>
                    <p className="text-[12px] uppercase tracking-[0.25em] text-cream">{fmtMonth(monthStart)}</p>
                    <button data-testid="booking-calendar-next" aria-label="Next month" disabled={monthOffset === 2} onClick={() => setMonthOffset((m) => Math.min(2, m + 1))} className="text-beige disabled:opacity-25 hover:text-brass transition-colors p-1"><IcRight size={18} /></button>
                  </div>
                  <div className="grid grid-cols-7 gap-1 mb-2">
                    {WEEKDAYS.map((d) => <span key={d} className="text-center text-[10px] uppercase tracking-[0.2em] text-beige/50 py-1">{d}</span>)}
                  </div>
                  <div className="grid grid-cols-7 gap-1">
                    {days.map((day) => {
                      const disabled = day < startOfDay(now) || [0, 1].includes(day.getDay()) || day.getMonth() !== monthStart.getMonth();
                      const selected = sameDay(day, date);
                      return (
                        <button key={day.toISOString()} data-testid={"booking-calendar-day-" + day.toISOString().slice(0, 10)} disabled={disabled}
                          onClick={() => { setDate(day); if (time && !slotsFor(day).includes(time)) setTime(null); }}
                          className={"cal-day aspect-square text-sm transition-colors duration-200 " +
                            (selected ? "bg-brass text-obsidian font-medium" : disabled ? "text-beige/20 cursor-not-allowed" : "text-cream/85 hover:bg-surface-2 hover:text-brass")}>
                          {day.getDate()}
                        </button>
                      );
                    })}
                  </div>
                  <p className="text-[11px] text-beige/50 mt-4 tracking-wide">Closed Mondays & Sundays</p>
                </div>
              </div>
            </Reveal>
            <Reveal>
              <div data-testid="booking-step-time">
                <StepLabel n="04" title="Choose time" done={!!time} />
                <div className="flex flex-wrap gap-2">
                  {(date ? slotsFor(date) : TIME_SLOTS).map((t) => (
                    <button key={t} data-testid={"booking-time-slot-" + t} onClick={() => setTime(t)}

                      {t}
                    </button>
                  ))}

              </div>

          <div className="lg:col-span-5">

              <dl className="space-y-5 mb-8">
                {summary.map(([k, v]) => (
                  <div key={k} data-testid={"booking-summary-" + k.toLowerCase()} className="flex items-baseline justify-between gap-4 border-b border-cream/10 pb-4">

                    <dd className="text-sm text-cream text-right">{v}</dd>
                  </div>
                ))}
              </dl>
              <div className="flex items-baseline justify-between mb-2">
                <span className="text-[11px] uppercase tracking-[0.2em] text-beige/60">Total</span>
                <span className="font-display text-3xl text-brass">{svc ? svc.price : "—"}</span>
              </div>
              {svc && <p className="text-[11px] uppercase tracking-[0.2em] text-beige/50 mb-8 text-right">{svc.duration}</p>}
              <p className="text-xs text-beige/60 mb-6">No payment today · Pay at the studio.</p>
              <button data-testid="booking-confirm-button" disabled={!canConfirm} onClick={confirm}
                className={"w-full text-[12px] uppercase tracking-[0.22em] px-8 py-4 transition-colors duration-300 " +
                  (canConfirm ? "bg-brass text-obsidian hover:bg-brass-light" : "border border-cream/15 text-beige/40 cursor-not-allowed")}>
                Confirm Appointment
              </button>
            </div>
          </div>
        </div>
      </div>

      <AnimatePresence>
        {confirmed && (
          <motion.div data-testid="booking-confirmation-modal" className="fixed inset-0 z-[100] flex items-center justify-center px-6" initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}>
            <div className="absolute inset-0 bg-obsidian/85 backdrop-blur-sm" onClick={() => setConfirmed(null)} />
            <motion.div initial={{ opacity: 0, y: 40, scale: 0.97 }} animate={{ opacity: 1, y: 0, scale: 1 }} exit={{ opacity: 0, y: 20 }} transition={{ duration: 0.5, ease: EASE }}
              className="relative bg-surface border border-brass/20 max-w-md w-full p-10 text-center">
              <span className="inline-block text-brass mb-6"><IcCheck size={40} sw={1.25} /></span>
              <p className="text-[11px] uppercase tracking-swiss text-brass mb-3">Appointment confirmed</p>
              <p data-testid="confirmation-reference" className="font-display text-3xl text-cream mb-6">{confirmed.ref}</p>
              <div className="text-sm text-beige/85 space-y-1 mb-8">

                <p>{date ? fmtDay(date) : ""}</p>

                Done
              </button>
            </motion.div>
          </motion.div>
        )}
      </AnimatePresence>

      {toastMsg && (
        <div data-testid="booking-toast" className="fixed bottom-6 right-6 z-[110] bg-surface border border-brass/30 text-cream text-sm px-5 py-4 shadow-2xl">

        </div>
      )}
    </section>
  );
}
